name: Data integrity, pipeline, EDA, W9-W12 and Phase 5.1 tests

on:
  push:
    branches: [Dung, main]
  pull_request:

jobs:
  python-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m compileall -q app.py src tests
      - name: Unit tests (no raw dataset required)
        run: python -m unittest discover -s tests -v
      - name: Pipeline preflight
        run: python -m src.run_pipeline --dry-run
      - name: Classification preflight
        run: python -m src.run_phase5 --dry-run
      - name: Fairness audit preflight
        run: python -m src.run_phase6 --dry-run
      - name: Final documentation and delivery preflight
        run: python -m src.run_phase7 --dry-run
